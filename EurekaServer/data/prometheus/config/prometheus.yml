scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 2s
    static_configs:
      - targets: [ 'eurekaserver:8761' ]
        labels:
          application: 'eurekaserver'
      - targets : [ 'apigateway:8080' ]
        labels:
          application: 'apigateway'
      - targets: [ 'userservice:8081' ]
        labels:
          application: 'userservice'
      - targets: [ 'authenticationservice:8082' ]
        labels:
          application: 'authenticationservice'